<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>П.О.</title>
  <style>
    *,::before,::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0b0f17;
      --card:#161e2e;
      --hover:#1e293b;
      --border:#26334d;
      --brand:#0ea5e9;
      --brand-light:#38bdf8;
      --text:#f8fafc;
      --text-muted:#94a3b8;
      --text-dim:#64748b;
    }
    html{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    body{
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      -webkit-tap-highlight-color:transparent;
      padding:1rem;
      display:flex;
      justify-content:center;
    }
    @media(min-width:640px){body{padding:1.5rem}}
    @media(min-width:768px){body{padding:2.5rem}}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--hover);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#334155}
    .wrap{width:100%;max-width:56rem;display:flex;flex-direction:column;gap:1.5rem}
    .platform-bar{display:flex;align-items:center;justify-content:center}
    .platform-selector{
      position:relative;display:inline-flex;padding:6px;
      background:var(--card);border:1px solid var(--border);
      border-radius:1rem;gap:6px;max-width:100%;overflow-x:auto;
    }
    .platform-indicator{
      position:absolute;top:6px;bottom:6px;left:0;
      background:var(--brand);border-radius:0.75rem;
      box-shadow:0 2px 8px rgba(14,165,233,.2);
      pointer-events:none;opacity:0;
      transition:width .2s cubic-bezier(.4,0,.2,1),transform .2s cubic-bezier(.4,0,.2,1),opacity .15s;
    }
    .platform-btn{
      position:relative;z-index:1;display:flex;align-items:center;gap:8px;
      padding:8px 16px;border-radius:0.75rem;border:none;background:transparent;
      cursor:pointer;font-size:.8rem;font-weight:600;
      color:var(--text-muted);transition:color .15s;white-space:nowrap;
      font-family:inherit;
    }
    @media(min-width:640px){.platform-btn{font-size:.875rem}}
    .platform-btn:hover{color:var(--text)}
    .platform-btn.active{color:#fff}
    .toolbar{display:flex;flex-direction:column;gap:.75rem;align-items:center;justify-content:space-between}
    @media(min-width:640px){.toolbar{flex-direction:row}}
    .search-wrap{position:relative;width:100%}
    @media(min-width:640px){.search-wrap{width:20rem}}
    .search-icon{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      color:var(--text-muted);pointer-events:none;
    }
    .search-input{
      width:100%;padding:10px 36px 10px 40px;
      background:var(--card);border:1px solid var(--border);
      border-radius:.75rem;color:var(--text);font-size:.875rem;
      font-family:inherit;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .search-input::placeholder{color:var(--text-muted)}
    .search-input:focus{border-color:var(--brand-light);box-shadow:0 0 0 2px rgba(56,189,248,.2)}
    .clear-btn{
      display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--text-muted);
      align-items:center;padding:2px;
    }
    .clear-btn:hover{color:var(--text)}
    .clear-btn.visible{display:flex}
    .btn-group{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-end}
    @media(min-width:640px){.btn-group{width:auto}}
    .ctrl-btn{
      flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
      padding:8px 14px;font-size:.75rem;font-weight:600;
      color:#cbd5e1;background:var(--card);border:1px solid var(--border);
      border-radius:.75rem;cursor:pointer;transition:background .2s;
      font-family:inherit;white-space:nowrap;
    }
    @media(min-width:640px){.ctrl-btn{flex:none}}
    .ctrl-btn:hover{background:var(--hover)}
    #catalog{display:flex;flex-direction:column;gap:1rem}
    .cat-box{
      border-radius:1rem;border:1px solid var(--border);
      background:rgba(22,30,46,.6);overflow:hidden;
      box-shadow:0 4px 16px rgba(0,0,0,.3);
    }
    .cat-header{
      padding:16px 20px;display:flex;align-items:center;
      justify-content:space-between;cursor:pointer;user-select:none;
      background:var(--card);transition:background .15s;
    }
    .cat-header:hover{background:rgba(30,41,59,.8)}
    .cat-header-left{display:flex;align-items:center;gap:12px}
    .cat-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted)}
    .cat-name{font-weight:700;font-size:1rem;color:#f1f5f9;letter-spacing:.01em}
    @media(min-width:640px){.cat-name{font-size:1.125rem}}
    .cat-count{
      padding:2px 10px;font-size:.75rem;font-weight:600;
      border-radius:9999px;background:#1e293b;color:var(--brand-light);
      border:1px solid rgba(51,65,85,.6);
    }
    .chevron{color:var(--text-muted);padding:4px;border-radius:.5rem;transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .cat-box.collapsed .chevron{transform:rotate(-90deg)}
    .cat-content{
      transition:height .35s cubic-bezier(.4,0,.2,1),opacity .3s ease;
      overflow:hidden;
      will-change:height,opacity;
    }
    .cat-content.collapsed{
      height:0 !important;
      opacity:0;
      pointer-events:none;
    }
    .cat-inner{padding:12px}
    @media(min-width:640px){.cat-inner{padding:16px}}
    .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.75rem}
    @media(max-width:520px){.app-grid{grid-template-columns:1fr}}
    .app-card{
      display:flex;align-items:center;gap:14px;padding:12px;
      border-radius:.75rem;text-decoration:none;
      background:rgba(22,30,46,.75);
      border:1px solid rgba(38,51,77,.8);
      backdrop-filter:blur(8px);
      transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;
      box-shadow:0 1px 4px rgba(0,0,0,.2);
    }
    .app-card:hover{
      background:rgba(30,41,59,.9);
      border-color:rgba(56,189,248,.4);
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(14,165,233,.05);
    }
    .app-icon{
      width:40px;height:40px;flex-shrink:0;
      border-radius:.5rem;background:rgba(30,41,59,.8);
      padding:6px;display:flex;align-items:center;justify-content:center;
      overflow:hidden;transition:transform .2s;
    }
    @media(min-width:640px){.app-icon{width:44px;height:44px}}
    .app-card:hover .app-icon{transform:scale(1.05)}
    .app-icon img{width:100%;height:100%;object-fit:contain;display:block}
    .app-name{
      font-size:.75rem;font-weight:600;color:#e2e8f0;
      line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;
      transition:color .2s;
    }
    @media(min-width:640px){.app-name{font-size:.875rem}}
    .app-card:hover .app-name{color:var(--brand-light)}
    #noResults{display:none;text-align:center;padding:3rem 0;flex-direction:column;align-items:center;gap:.75rem}
    #noResults.visible{display:flex}
    .no-res-icon{
      display:inline-flex;align-items:center;justify-content:center;
      width:48px;height:48px;border-radius:9999px;
      background:#1e293b;color:var(--text-muted);
    }
    footer{
      text-align:center;padding:1.5rem 0 .5rem;
      font-size:.75rem;color:var(--text-dim);
      border-top:1px solid rgba(38,51,77,.5);
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="platform-bar">
      <div id="platformSelector" class="platform-selector">
        <div id="platformIndicator" class="platform-indicator"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Поиск программы..." class="search-input" autocomplete="off" spellcheck="false">
        <button id="clearSearch" class="clear-btn" aria-label="Очистить">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="btn-group">
        <button id="expandAllBtn" class="ctrl-btn">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/></svg>
          Раскрыть все
        </button>
        <button id="collapseAllBtn" class="ctrl-btn">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7"/></svg>
          Свернуть все
        </button>
      </div>
    </div>

    <div id="catalog"></div>

    <div id="noResults">
      <div class="no-res-icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p style="color:#cbd5e1;font-weight:500">Ничего не найдено</p>
      <p style="color:var(--text-dim);font-size:.875rem">Попробуйте изменить поисковый запрос</p>
    </div>

    <footer>Cr1mz</footer>
  </div>

  <script>
  (function(){
    var platformsData = [];
    var currentPlatformId = '';
    var searchDebounce = null;

    function getDefaultPlatform(){
      return window.matchMedia('(orientation:portrait)').matches ? 'android' : 'windows';
    }

    function getFallbackIcon(name){
      var initial = (name || 'A').charAt(0).toUpperCase();
      var colors = ['#38bdf8','#818cf8','#34d399','#f472b6','#fbbf24','#a78bfa'];
      var color = colors[name.length % colors.length];
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'+
        '<rect width="40" height="40" fill="'+color+'" fill-opacity=".15" rx="8"/>'+
        '<text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="'+color+'" font-weight="700" font-size="18">'+initial+'</text>'+
        '</svg>'
      );
    }

    function updateIndicator(){
      var sel = document.getElementById('platformSelector');
      var btn = sel.querySelector('[data-pid="' + currentPlatformId + '"]');
      var ind = document.getElementById('platformIndicator');
      if(btn && ind){
        ind.style.width = btn.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
        ind.style.opacity = '1';
      }
    }

    function renderPlatformSelector(){
      var sel = document.getElementById('platformSelector');
      var ind = document.getElementById('platformIndicator');
      sel.innerHTML = '';
      sel.appendChild(ind);

      var frag = document.createDocumentFragment();
      for(var i = 0; i < platformsData.length; i++){
        var p = platformsData[i];
        var btn = document.createElement('button');
        btn.className = 'platform-btn' + (p.id === currentPlatformId ? ' active' : '');
        btn.dataset.pid = p.id;
        if (p.icon.trim().indexOf('<svg') === 0) {
          btn.innerHTML = '<span class="platform-icon" style="display:flex;width:18px;height:18px;">' + p.icon + '</span><span>' + p.name + '</span>';
        } else {
          btn.innerHTML = '<img src="' + p.icon + '" style="width:18px;height:18px;object-fit:contain;"><span>' + p.name + '</span>';
        }
        btn.addEventListener('click', onPlatformClick);
        frag.appendChild(btn);
      }
      sel.appendChild(frag);
      requestAnimationFrame(updateIndicator);
    }

    function onPlatformClick(){
      var pid = this.dataset.pid;
      if(pid === currentPlatformId) return;
      currentPlatformId = pid;
      document.querySelectorAll('.platform-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.pid === pid);
      });
      updateIndicator();
      var si = document.getElementById('searchInput');
      si.value = '';
      document.getElementById('clearSearch').classList.remove('visible');
      renderCatalog('');
    }

    function setWrapperHeight(wrapper, expanding){
      if(expanding){
        wrapper.classList.remove('collapsed');
        var fullHeight = wrapper.scrollHeight;
        wrapper.style.height = fullHeight + 'px';
        wrapper.style.opacity = '1';

        var onTransitionEnd = function(e){
          if(e.propertyName === 'height' && !wrapper.classList.contains('collapsed')){
            wrapper.style.height = 'auto';
          }
          wrapper.removeEventListener('transitionend', onTransitionEnd);
        };
        wrapper.addEventListener('transitionend', onTransitionEnd);
      } else {
        wrapper.style.height = wrapper.scrollHeight + 'px';
        wrapper.offsetHeight;
        wrapper.classList.add('collapsed');
        wrapper.style.height = '0';
        wrapper.style.opacity = '0';
      }
    }

    function renderCatalog(query){
      var container = document.getElementById('catalog');
      var noRes = document.getElementById('noResults');
      container.innerHTML = '';

      var platform = null;
      for(var i = 0; i < platformsData.length; i++){
        if(platformsData[i].id === currentPlatformId){ platform = platformsData[i]; break; }
      }
      if(!platform) return;

      var q = query.toLowerCase().trim();
      var total = 0;
      var frag = document.createDocumentFragment();

      for(var ci = 0; ci < platform.categories.length; ci++){
        var cat = platform.categories[ci];
        var apps = q
          ? cat.apps.filter(function(a){ return a.name.toLowerCase().indexOf(q) !== -1; })
          : cat.apps;

        if(q && apps.length === 0) continue;
        total += apps.length;

        var open = q ? true : cat.defaultOpen;

        var box = document.createElement('div');
        box.className = 'cat-box' + (open ? '' : ' collapsed');

        var hdr = document.createElement('div');
        hdr.className = 'cat-header';

        var left = document.createElement('div');
        left.className = 'cat-header-left';

        if(cat.icon){
          var iconEl = document.createElement('span');
          iconEl.className = 'cat-icon';
          iconEl.innerHTML = cat.icon;
          left.appendChild(iconEl);
        }

        var nameEl = document.createElement('span');
        nameEl.className = 'cat-name';
        nameEl.textContent = cat.categoryName;

        var countEl = document.createElement('span');
        countEl.className = 'cat-count';
        countEl.textContent = apps.length;

        left.appendChild(nameEl);
        left.appendChild(countEl);

        var chevron = document.createElement('div');
        chevron.className = 'chevron';
        chevron.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>';

        hdr.appendChild(left);
        hdr.appendChild(chevron);

        var wrapper = document.createElement('div');
        wrapper.className = 'cat-content' + (open ? '' : ' collapsed');

        var inner = document.createElement('div');
        inner.className = 'cat-inner';

        var grid = document.createElement('div');
        grid.className = 'app-grid';

        var cardFrag = document.createDocumentFragment();
        for(var ai = 0; ai < apps.length; ai++){
          (function(app){
            var card = document.createElement('a');
            card.href = app.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.className = 'app-card';

            var iconWrap = document.createElement('div');
            iconWrap.className = 'app-icon';

            var img = document.createElement('img');
            img.alt = app.name;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.src = app.icon || getFallbackIcon(app.name);
            img.onerror = function(){
              this.onerror = null;
              this.src = getFallbackIcon(app.name);
            };
            iconWrap.appendChild(img);

            var nameSpan = document.createElement('span');
            nameSpan.className = 'app-name';
            nameSpan.textContent = app.name;

            card.appendChild(iconWrap);
            card.appendChild(nameSpan);
            cardFrag.appendChild(card);
          })(apps[ai]);
        }

        grid.appendChild(cardFrag);
        inner.appendChild(grid);
        wrapper.appendChild(inner);

        (function(b, w){
          hdr.addEventListener('click', function(){
            var isCollapsed = w.classList.contains('collapsed');
            b.classList.toggle('collapsed', !isCollapsed);
            setWrapperHeight(w, isCollapsed);
          });
        })(box, wrapper);

        box.appendChild(hdr);
        box.appendChild(wrapper);
        frag.appendChild(box);

        if(open){
          wrapper.style.height = 'auto';
          wrapper.style.opacity = '1';
        }
      }

      container.appendChild(frag);
      noRes.classList.toggle('visible', total === 0);
    }

    var searchInput = document.getElementById('searchInput');
    var clearBtn = document.getElementById('clearSearch');

    searchInput.addEventListener('input', function(){
      var val = this.value;
      clearBtn.classList.toggle('visible', val.length > 0);
      clearTimeout(searchDebounce);
      var v = val;
      searchDebounce = setTimeout(function(){ renderCatalog(v); }, 120);
    });

    clearBtn.addEventListener('click', function(){
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      renderCatalog('');
      searchInput.focus();
    });

    document.getElementById('expandAllBtn').addEventListener('click', function(){
      document.querySelectorAll('.cat-content').forEach(function(w){
        var box = w.closest('.cat-box');
        if(box) box.classList.remove('collapsed');
        if(w.classList.contains('collapsed')){
          setWrapperHeight(w, true);
        }
      });
    });

    document.getElementById('collapseAllBtn').addEventListener('click', function(){
      document.querySelectorAll('.cat-content').forEach(function(w){
        var box = w.closest('.cat-box');
        if(box) box.classList.add('collapsed');
        if(!w.classList.contains('collapsed')){
          setWrapperHeight(w, false);
        }
      });
    });

    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function(){
        updateIndicator();
        document.querySelectorAll('.cat-content:not(.collapsed)').forEach(function(w){
          w.style.height = 'auto';
        });
      }, 100);
    });

    currentPlatformId = getDefaultPlatform();
    fetch('./data.json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        platformsData = data;
        renderPlatformSelector();
        renderCatalog('');
      })
      .catch(function(e){ console.error('Ошибка загрузки данных:', e); });
  })();
  </script>
</body>
</html>
