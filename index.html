<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/87567822?v=4">
  <title>П.О.</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            },
            dark: {
              bg: '#0b0f17',
              card: '#161e2e',
              hover: '#1e293b',
              border: '#26334d'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f17;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .category-content-wrapper {
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      overflow: hidden;
      will-change: height, opacity;
    }

    .category-content-wrapper.collapsed {
      height: 0 !important;
      opacity: 0;
      pointer-events: none;
    }

    .chevron-icon {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .collapsed .chevron-icon {
      transform: rotate(-90deg);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 520px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
    }

    .glass-card {
      background: rgba(22, 30, 46, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(38, 51, 77, 0.8);
    }

    .glass-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(56, 189, 248, 0.4);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Анимация перетекающего индикатора платформ */
    .platform-indicator {
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="p-4 sm:p-6 md:p-10 flex justify-center">

  <div class="w-full max-w-4xl space-y-6">
    
    <header class="text-center space-y-2 py-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
        <span class="bg-gradient-to-r from-brand-400 to-sky-200 bg-clip-text text-transparent">П.О.</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto">
        Ссылки на программы
      </p>
    </header>

    <div class="flex items-center justify-center">
      <div id="platformSelector" class="relative inline-flex p-1.5 bg-dark-card border border-dark-border rounded-2xl gap-1.5 max-w-full overflow-x-auto">
        <div id="platformIndicator" class="platform-indicator absolute top-1.5 bottom-1.5 left-0 bg-brand-500 rounded-xl shadow-md shadow-brand-500/20 pointer-events-none opacity-0"></div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Поиск программы..." 
          class="w-full pl-10 pr-9 py-2.5 bg-dark-card border border-dark-border rounded-xl text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-400/50 focus:border-brand-400 transition-all duration-200 shadow-sm"
        >
        <button id="clearSearch" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button 
          id="expandAllBtn" 
          class="flex-1 sm:flex-none px-3.5 py-2 text-xs font-semibold text-slate-300 bg-dark-card border border-dark-border hover:bg-slate-800 rounded-xl transition-all duration-200 flex items-center justify-center gap-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/></svg>
          Раскрыть все
        </button>
        <button 
          id="collapseAllBtn" 
          class="flex-1 sm:flex-none px-3.5 py-2 text-xs font-semibold text-slate-300 bg-dark-card border border-dark-border hover:bg-slate-800 rounded-xl transition-all duration-200 flex items-center justify-center gap-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7"/></svg>
          Свернуть все
        </button>
      </div>
    </div>

    <div id="catalog" class="space-y-4"></div>

    <div id="noResults" class="hidden text-center py-12 space-y-3">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-800 text-slate-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p class="text-slate-300 font-medium">Ничего не найдено</p>
      <p class="text-slate-500 text-sm">Попробуйте изменить поисковый запрос</p>
    </div>

    <footer class="text-center pt-6 pb-2 text-xs text-slate-500 border-t border-dark-border/50">
      <p>Cr1mz</p>
    </footer>

  </div>

  <script>
    let platformsData = [];

    // Определяем вкладку по умолчанию в зависимости от ориентации экрана (портретный режим)
    function getDefaultPlatform() {
      const isPortrait = window.matchMedia("(orientation: portrait)").matches;
      return isPortrait ? "android" : "windows";
    }

    let currentPlatformId = getDefaultPlatform();

    function getFallbackIcon(name) {
      const initial = (name || 'A').charAt(0).toUpperCase();
      const colors = ['#38bdf8', '#818cf8', '#34d399', '#f472b6', '#fbbf24', '#a78bfa'];
      const color = colors[name.length % colors.length];
      
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" class="w-full h-full rounded-lg">
        <rect width="40" height="40" fill="${color}" fill-opacity="0.15" rx="8"/>
        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="${color}" font-weight="700" font-size="18">${initial}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function updateIndicator() {
      const selector = document.getElementById('platformSelector');
      const activeBtn = selector.querySelector(`[data-platform-id="${currentPlatformId}"]`);
      const indicator = document.getElementById('platformIndicator');

      if (activeBtn && indicator) {
        indicator.style.width = `${activeBtn.offsetWidth}px`;
        indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
        indicator.classList.remove('opacity-0');
      }
    }

    function renderPlatformSelector() {
      const selector = document.getElementById('platformSelector');
      selector.querySelectorAll('button').forEach(btn => btn.remove());

      platformsData.forEach(platform => {
        const isActive = platform.id === currentPlatformId;
        const btn = document.createElement('button');
        btn.dataset.platformId = platform.id;
        
        btn.className = `relative z-10 flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-colors duration-150 select-none ${
          isActive 
            ? 'text-white' 
            : 'text-slate-400 hover:text-white'
        }`;
        
        btn.innerHTML = `${platform.icon} <span>${platform.name}</span>`;

        btn.addEventListener('click', () => {
          if (currentPlatformId !== platform.id) {
            currentPlatformId = platform.id;
            
            selector.querySelectorAll('button').forEach(b => {
              const isCurr = b.dataset.platformId === currentPlatformId;
              b.className = `relative z-10 flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-colors duration-150 select-none ${
                isCurr ? 'text-white' : 'text-slate-400 hover:text-white'
              }`;
            });

            updateIndicator();

            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            document.getElementById('clearSearch').classList.add('hidden');

            renderCatalog();
          }
        });

        selector.appendChild(btn);
      });

      requestAnimationFrame(() => {
        updateIndicator();
      });
    }

    function setWrapperHeight(wrapper, isExpanding) {
      if (isExpanding) {
        wrapper.classList.remove('collapsed');
        const innerGrid = wrapper.querySelector('.app-grid');
        const targetHeight = innerGrid.offsetHeight + 24;
        wrapper.style.height = `${targetHeight}px`;
        wrapper.style.opacity = '1';
        
        setTimeout(() => {
          if (!wrapper.classList.contains('collapsed')) {
            wrapper.style.height = 'auto';
          }
        }, 360);
      } else {
        wrapper.style.height = `${wrapper.offsetHeight}px`;
        wrapper.offsetHeight; 
        wrapper.classList.add('collapsed');
        wrapper.style.height = '0px';
        wrapper.style.opacity = '0';
      }
    }

    function renderCatalog(filterText = '') {
      const container = document.getElementById('catalog');
      const noResults = document.getElementById('noResults');
      container.innerHTML = '';

      const currentPlatform = platformsData.find(p => p.id === currentPlatformId);
      if (!currentPlatform) return;

      let totalVisibleApps = 0;
      const query = filterText.toLowerCase().trim();

      currentPlatform.categories.forEach((cat) => {
        const filteredApps = cat.apps.filter(app => 
          app.name.toLowerCase().includes(query)
        );

        if (query && filteredApps.length === 0) {
          return;
        }

        totalVisibleApps += filteredApps.length;

        const catBox = document.createElement('div');
        catBox.className = 'rounded-2xl border border-dark-border bg-dark-card/60 overflow-hidden shadow-lg transition-all duration-200';

        const catHeader = document.createElement('div');
        catHeader.className = 'px-5 py-4 flex items-center justify-between cursor-pointer select-none bg-dark-card hover:bg-dark-hover/80 transition-colors duration-150';

        const shouldBeOpen = query ? true : cat.defaultOpen;

        catHeader.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-bold text-base sm:text-lg text-slate-100 tracking-wide">${cat.categoryName}</span>
            <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-slate-800 text-brand-400 border border-slate-700/60">
              ${filteredApps.length}
            </span>
          </div>
          <div class="chevron-icon text-slate-400 p-1 rounded-lg hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        `;

        const wrapper = document.createElement('div');
        wrapper.className = `category-content-wrapper ${shouldBeOpen ? '' : 'collapsed'}`;
        
        const innerContent = document.createElement('div');
        innerContent.className = 'p-3 sm:p-4';

        const grid = document.createElement('div');
        grid.className = 'app-grid';

        filteredApps.forEach(app => {
          const card = document.createElement('a');
          card.href = app.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = 'glass-card group flex items-center gap-3.5 p-3 rounded-xl transition-all duration-200 hover:-translate-y-0.5 shadow-sm hover:shadow-md hover:shadow-brand-500/5';

          const iconWrapper = document.createElement('div');
          iconWrapper.className = 'w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-slate-800/80 p-1.5 flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform duration-200 overflow-hidden';

          const img = document.createElement('img');
          img.src = app.icon;
          img.alt = app.name;
          img.className = 'w-full h-full object-contain';
          img.loading = 'lazy';
          
          img.onerror = function() {
            this.onerror = null;
            this.src = getFallbackIcon(app.name);
          };

          iconWrapper.appendChild(img);

          const nameSpan = document.createElement('span');
          nameSpan.className = 'text-xs sm:text-sm font-semibold text-slate-200 group-hover:text-brand-400 transition-colors line-clamp-2 leading-snug';
          nameSpan.textContent = app.name;

          card.appendChild(iconWrapper);
          card.appendChild(nameSpan);
          grid.appendChild(card);
        });

        innerContent.appendChild(grid);
        wrapper.appendChild(innerContent);

        catHeader.addEventListener('click', () => {
          const isCollapsed = wrapper.classList.contains('collapsed');
          catHeader.querySelector('.chevron-icon').parentElement.classList.toggle('collapsed', !isCollapsed);
          setWrapperHeight(wrapper, isCollapsed);
        });

        if (!shouldBeOpen) {
          catHeader.querySelector('.chevron-icon').parentElement.classList.add('collapsed');
        }

        catBox.appendChild(catHeader);
        catBox.appendChild(wrapper);
        container.appendChild(catBox);

        if (shouldBeOpen) {
          requestAnimationFrame(() => {
            wrapper.style.height = 'auto';
            wrapper.style.opacity = '1';
          });
        }
      });

      if (totalVisibleApps === 0) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
      }
    }

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      const value = e.target.value;
      if (value.length > 0) {
        clearSearch.classList.remove('hidden');
      } else {
        clearSearch.classList.add('hidden');
      }
      renderCatalog(value);
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.classList.add('hidden');
      renderCatalog('');
    });

    document.getElementById('expandAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.category-content-wrapper').forEach(wrapper => {
        const header = wrapper.previousElementSibling;
        header.querySelector('.chevron-icon').parentElement.classList.remove('collapsed');
        setWrapperHeight(wrapper, true);
      });
    });

    document.getElementById('collapseAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.category-content-wrapper').forEach(wrapper => {
        const header = wrapper.previousElementSibling;
        header.querySelector('.chevron-icon').parentElement.classList.add('collapsed');
        setWrapperHeight(wrapper, false);
      });
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        updateIndicator();
        document.querySelectorAll('.category-content-wrapper:not(.collapsed)').forEach(wrapper => {
          wrapper.style.height = 'auto';
        });
      }, 100);
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetch('./data.json')
        .then(response => response.json())
        .then(data => {
          platformsData = data;
          renderPlatformSelector();
          renderCatalog();
        })
        .catch(error => console.error('Ошибка загрузки данных:', error));
    });
  </script>
</body>
</html>
